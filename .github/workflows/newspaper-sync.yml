name: Newspaper sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Sync university newspaper
        env:
          SYNC_URL: https://www.hadeed.shop/api/sync-newspaper
          CRON_SECRET: ${{ secrets.NEWSPAPER_SYNC_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "NEWSPAPER_SYNC_SECRET is not configured in GitHub repository secrets"
            exit 1
          fi
          curl --location --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${SYNC_URL}"
          curl --location --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "https://www.hadeed.shop/api/process-study-sessions"
          curl --location --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "https://www.hadeed.shop/api/process-notification-queue"
